[workspace]
resolver = "2"
members = [
    "crates/synara-protocol",
    "crates/synara-sync",
    "crates/synara-rpc",
    "crates/synara-session",
    "crates/synara-supervisor",
    "crates/synara-instabox",
    "crates/synara-probe",
    "crates/synara-app",
]
# synara-app pulls in GPUI, so plain `cargo build`/`cargo test` skip it and the
# headless crates stay quick on machines without GPU libraries. Build it with
# `-p synara-app` (see native/README.md).
default-members = [
    "crates/synara-protocol",
    "crates/synara-sync",
    "crates/synara-rpc",
    "crates/synara-session",
    "crates/synara-supervisor",
    "crates/synara-instabox",
    "crates/synara-probe",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.90"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "io-util", "signal", "fs"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive", "env"] }
rand = "0.9"
nix = { version = "0.30", default-features = false, features = ["signal"] }

synara-protocol = { path = "crates/synara-protocol" }
synara-rpc = { path = "crates/synara-rpc" }
synara-sync = { path = "crates/synara-sync" }
synara-session = { path = "crates/synara-session" }
synara-supervisor = { path = "crates/synara-supervisor" }
synara-instabox = { path = "crates/synara-instabox" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
